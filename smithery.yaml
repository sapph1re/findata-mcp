startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    required: []
  commandFunction: |-
    (config) => ({
      command: "uvx",
      args: ["findata-mcp"],
      env: {}
    })

# ── Metadata ─────────────────────────────────────────────────────────────────
name: findata-mcp
version: "0.3.5"
description: |
  Real-time financial data MCP for AI agents. Five tools: stock prices (NYSE,
  NASDAQ, 50,000+ tickers), equity fundamentals (P/E ratio, revenue, earnings,
  market cap, beta, dividend yield), 800,000+ FRED macroeconomic series (GDP,
  CPI, inflation, interest rates, fed funds rate, Treasury yields,
  unemployment), SEC EDGAR filings (10-K annual reports, 10-Q, 8-K from any
  public company), and cryptocurrency prices (Bitcoin, Ethereum, 8,000+ coins).
  Free trial: 50 calls/day. Pay-per-use: $0.01/call via x402 — no signup,
  no API key required.

author: Cortex
homepage: https://pypi.org/project/findata-mcp/
repository: https://github.com/sapph1re/findata-mcp
license: MIT
category: Finance

keywords:
  - finance
  - stocks
  - stock-market
  - stock-price
  - market-data
  - real-time
  - financial-data
  - equity
  - fundamentals
  - earnings
  - market-cap
  - pe-ratio
  - economics
  - macroeconomic
  - gdp
  - cpi
  - inflation
  - interest-rates
  - treasury
  - fred
  - federal-reserve
  - sec-filings
  - edgar
  - annual-report
  - 10-k
  - 10-q
  - 8-k
  - crypto
  - cryptocurrency
  - bitcoin
  - ethereum
  - coingecko
  - yfinance
  - x402
  - micropayments
  - ai-agent
  - mcp

# ── Tools ────────────────────────────────────────────────────────────────────
tools:
  - name: stock_quote
    description: |
      Real-time stock price, volume, and change percentage for any publicly
      traded equity. Covers NYSE, NASDAQ, and 50+ global exchanges via
      yfinance. Returns current price, open, high, low, volume, market cap,
      and daily change. 15-min delayed. Alias: stock_price.
    inputSchema:
      type: object
      properties:
        ticker:
          type: string
          description: Stock ticker symbol (e.g. AAPL, TSLA, MSFT, NVDA, SPY)
      required: [ticker]

  - name: stock_price
    description: |
      Alias for stock_quote. Real-time (15-min delayed) stock price, volume,
      market cap, and change percentage for any NYSE or NASDAQ ticker.
    inputSchema:
      type: object
      properties:
        ticker:
          type: string
          description: Stock ticker symbol (e.g. AAPL, TSLA, MSFT)
      required: [ticker]

  - name: company_fundamentals
    description: |
      Full equity fundamental data for any public company: revenue, net income,
      earnings per share (EPS), P/E ratio, price-to-book, market cap, sector,
      industry, beta, dividend yield, payout ratio, and company description.
      Data from Yahoo Finance. Cached 1hr.
    inputSchema:
      type: object
      properties:
        ticker:
          type: string
          description: Stock ticker symbol (e.g. AAPL, MSFT, GOOGL)
      required: [ticker]

  - name: economic_indicator
    description: |
      US macroeconomic data from the Federal Reserve Economic Data (FRED)
      database: GDP, CPI (inflation), unemployment rate, federal funds rate,
      Treasury yields (2yr, 10yr, 30yr), yield curve spread, M2 money supply,
      housing starts, retail sales, and 800,000+ other series. Cached 6hr.
    inputSchema:
      type: object
      properties:
        series_id:
          type: string
          description: |
            FRED series ID. Common examples: GDP (gross domestic product),
            CPIAUCSL (CPI inflation), UNRATE (unemployment), FEDFUNDS
            (fed funds rate), DGS10 (10yr Treasury yield), T10Y2Y (yield
            curve spread), M2SL (M2 money supply)
      required: [series_id]

  - name: sec_filing
    description: |
      Full text of SEC filings from EDGAR for any US public company: 10-K
      (annual report), 10-Q (quarterly report), 8-K (material events/earnings),
      DEF 14A (proxy statement), S-1 (IPO prospectus), and more. Free, no API
      key. Accepts ticker symbol or CIK number. Cached 24hr.
    inputSchema:
      type: object
      properties:
        ticker_or_cik:
          type: string
          description: Stock ticker (e.g. AAPL) or SEC CIK number (e.g. 320193)
        ticker:
          type: string
          description: Alias for ticker_or_cik — use either one
        symbol:
          type: string
          description: Alias for ticker_or_cik
        form_type:
          type: string
          description: SEC form type (10-K, 10-Q, 8-K, DEF 14A, S-1, etc.)
          default: "10-K"

  - name: crypto_price
    description: |
      Cryptocurrency market data via CoinGecko: current price in USD, market
      cap, 24h trading volume, 24h price change, and 7-day price sparkline.
      Supports 8,000+ coins including Bitcoin (BTC), Ethereum (ETH), Solana
      (SOL), and all major DeFi tokens. Cached 1min.
    inputSchema:
      type: object
      properties:
        coin_id:
          type: string
          description: |
            CoinGecko coin ID (lowercase-hyphenated). Examples: bitcoin,
            ethereum, solana, chainlink, uniswap, avalanche-2, matic-network
      required: [coin_id]

# ── Pricing ──────────────────────────────────────────────────────────────────
pricing:
  model: per-call
  currency: USD
  tiers:
    - name: Pay-per-call (x402)
      description: No signup. Any agent can pay automatically via x402 protocol.
      price: "$0.01 per call"

# ── Installation ─────────────────────────────────────────────────────────────
# smithery install findata-mcp
# OR add to claude_desktop_config.json manually (see README.md)
