# Smithery Registry Manifest — FinData MCP
# https://smithery.ai/server/findata-mcp
#
# Submission: https://smithery.ai/submit
# After deployment, also submit via GitHub PR to smithery-ai/registry

startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    required: []
  commandFunction: |-
    (config) => ({
      command: "uvx",
      args: ["findata-mcp"],
      env: {}
    })

# ── Metadata ─────────────────────────────────────────────────────────────────
name: findata-mcp
version: "0.3.5"
description: |
  The first comprehensive financial data MCP. Five tools covering real-time
  stocks, company fundamentals, economic indicators, SEC filings, and crypto —
  all in one server. Pay per call via x402 micropayments ($0.01/call).
  No signup required.

author: Cortex
homepage: https://pypi.org/project/findata-mcp/
repository: https://github.com/sapph1re/findata-mcp
license: MIT
category: Finance

keywords:
  - finance
  - stocks
  - financial-data
  - economics
  - sec-filings
  - crypto
  - x402
  - micropayments

# ── Tools ────────────────────────────────────────────────────────────────────
tools:
  - name: stock_quote
    description: |
      Real-time (15-min delayed) stock price, volume, and change percentage.
      Covers all NYSE, NASDAQ, and major global exchanges via yfinance.
      Also available as /stock_price and /api/v1/stock_price (aliases).
    inputSchema:
      type: object
      properties:
        ticker:
          type: string
          description: Stock ticker symbol (e.g. AAPL, TSLA, MSFT)
      required: [ticker]

  - name: stock_price
    description: |
      Alias for stock_quote. Real-time (15-min delayed) stock price, volume,
      and change percentage.
    inputSchema:
      type: object
      properties:
        ticker:
          type: string
          description: Stock ticker symbol (e.g. AAPL, TSLA, MSFT)
      required: [ticker]

  - name: company_fundamentals
    description: |
      Full fundamental data: revenue, earnings, P/E ratio, market cap, sector,
      beta, dividend yield, and company description. Cached 1hr.
    inputSchema:
      type: object
      properties:
        ticker:
          type: string
          description: Stock ticker symbol
      required: [ticker]

  - name: economic_indicator
    description: |
      US macroeconomic data from the Federal Reserve (FRED): GDP, CPI,
      unemployment rate, fed funds rate, yield curves, and 800,000+ series.
      120 requests/minute limit. Cached 6hr.
    inputSchema:
      type: object
      properties:
        series_id:
          type: string
          description: |
            FRED series ID. Examples: GDP, CPIAUCSL, UNRATE, FEDFUNDS,
            DGS10 (10yr Treasury), T10Y2Y (yield curve spread)
      required: [series_id]

  - name: sec_filing
    description: |
      Full text of SEC filings from EDGAR: 10-K (annual), 10-Q (quarterly),
      8-K (material events), and more. Free, no API key needed. Cached 24hr.
    inputSchema:
      type: object
      properties:
        ticker_or_cik:
          type: string
          description: Stock ticker (AAPL) or SEC CIK number (320193)
        ticker:
          type: string
          description: Alias for ticker_or_cik — use either one
        symbol:
          type: string
          description: Alias for ticker_or_cik
        form_type:
          type: string
          description: SEC form type (10-K, 10-Q, 8-K, DEF 14A, S-1, etc.)
          default: "10-K"

  - name: crypto_price
    description: |
      Cryptocurrency price, market cap, 24h volume, and 7-day sparkline
      via CoinGecko. 30 req/min free. Cached 1min.
    inputSchema:
      type: object
      properties:
        coin_id:
          type: string
          description: |
            CoinGecko coin ID. Examples: bitcoin, ethereum, solana,
            chainlink, uniswap. Use lowercase-hyphenated names.
      required: [coin_id]

# ── Pricing ──────────────────────────────────────────────────────────────────
pricing:
  model: per-call
  currency: USD
  tiers:
    - name: Pay-per-call (x402)
      description: No signup. Any agent can pay automatically via x402 protocol.
      price: "$0.01 per call"

# ── Installation ─────────────────────────────────────────────────────────────
# smithery install findata-mcp
# OR add to claude_desktop_config.json manually (see README.md)
