[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findata-mcp"
version = "0.3.0"
description = "Financial data MCP server — stocks, fundamentals, FRED economics, SEC filings, crypto via x402 micropayments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cortex Labs", email = "hello@findata-mcp.io" }]
keywords = [
  "mcp",
  "finance",
  "stocks",
  "financial-data",
  "economics",
  "FRED",
  "SEC",
  "cryptocurrency",
  "x402",
  "micropayments",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastmcp>=3.0.0",
  "requests>=2.31.0",
  "x402[evm]>=2.3.0",
  "eth-account>=0.13.0",
]

[project.urls]
Homepage = "https://findata-mcp.io"
Repository = "https://github.com/sapph1re/findata-mcp"
Documentation = "https://findata-mcp.io/docs"
"Bug Tracker" = "https://github.com/sapph1re/findata-mcp/issues"

[project.scripts]
findata-mcp = "findata_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["findata_mcp"]
# Only the thin client ships. backend/ (app.py, tools/, etc.) is server-side only (Railway).

[tool.hatch.build.targets.sdist]
include = ["findata_mcp/", "README.md", "pyproject.toml"]
